<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PicPulse owner login</title><link rel="stylesheet" href="/dashboard.css"><body><main style="margin:auto;max-width:500px;padding-top:15vh"><h1>PicPulse Control</h1><p>Owner sign in</p><form id="login"><label for="password">Dashboard password</label><input id="password" type="password" autocomplete="current-password" required style="display:block;width:100%;padding:12px;margin:10px 0"><button class="primary">Sign in</button><p id="error" role="alert"></p></form></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});let d=await r.json();if(r.ok)location.href='/';else document.getElementById('error').textContent=d.error}</script></body></html>
